[project]
name = "segformer-webcam"
version = "0.1.0"
description = "Run NVIDIA SegFormer semantic segmentation on a Mac webcam"
authors = [
    { name = "boomermath", email = "boomermath13@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[project.scripts]
segformer-webcam = "segformer_webcam:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
